[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "app-publisher"
version = "0.0.1"
description = "Validate and publish application releases through modular providers with store metadata and build automation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Paulo Coutinho"}]
keywords = ["apple", "google-play", "app-store", "firebase", "release", "yaml", "cli"]
dependencies = ["typer>=0.15,<1", "pydantic>=2.9,<3", "PyYAML>=6,<7", "httpx>=0.27,<1", "PyJWT[crypto]>=2.9,<3", "google-auth[requests]>=2.35,<3", "Pillow>=11,<13", "rich>=13,<15"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.13,<1", "build>=1.2,<2", "twine>=6,<7", "respx>=0.22,<1", "pytest-socket>=0.7,<1"]

[project.scripts]
app-publisher = "app_publisher.cli:main"

[project.urls]
Source = "https://github.com/paulocoutinhox/app-publisher"
Issues = "https://github.com/paulocoutinhox/app-publisher/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["app_publisher*"]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--disable-socket"]

[tool.coverage.run]
branch = true
source = ["app_publisher"]

[tool.coverage.report]
show_missing = true
fail_under = 100
